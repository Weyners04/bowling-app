version: "3.8"

services:
  backend:
    build: ./backend
    container_name: bowling-backend
    restart: always
    volumes:
      - ./backend/data:/app/data
    ports:
      - "3001:3001"

  frontend:
    build: ./frontend
    container_name: bowling-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend